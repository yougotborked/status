# Upptime configuration. Service URLs live in encrypted repository secrets ($SITE_...), not in this file,
# so this public repository and the status page do not reveal what my services are called or where they live.
owner: yougotborked
repo: status

sites:
  - name: Git
    url: $SITE_GIT
  - name: Login
    url: $SITE_LOGIN
  - name: Cloud
    url: $SITE_CLOUD
  - name: Band cloud
    url: $SITE_BAND_CLOUD
  - name: Band website
    url: $SITE_BAND
  - name: Band website (old domain)
    url: $SITE_BAND_OLD
  - name: Home automation
    url: $SITE_HOME
  - name: Media
    url: $SITE_MEDIA
  - name: Main site
    url: $SITE_MAIN

# Open an issue when something goes down and assign it to me, so GitHub notifies me (email and the GitHub mobile app).
assignees:
  - yougotborked

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 * * * *"
  graphs: "0 */6 * * *"
  summary: "*/30 * * * *"
  staticSite: "10,40 * * * *"
  updates: "0 3 * * 1"
  updateTemplate: "0 4 * * 1"

status-website:
  baseUrl: /status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime/master/assets/icon.svg
  name: Status
  introTitle: "Live status of my services."
  introMessage: "Checked every 5 minutes from outside my network. If something is down, an incident shows up here."
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/$OWNER/$REPO/issues
